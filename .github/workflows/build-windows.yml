name: Build Windows exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Gerar executável
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FlightPlotter
          --add-data "ui;ui" --add-data "data;data" --collect-all duckdb --collect-all webview
          --hidden-import openpyxl app.py
      - name: Publicar artefacto (pasta FlightPlotter com o .exe dentro)
        uses: actions/upload-artifact@v4
        with:
          name: FlightPlotter-windows
          path: dist/FlightPlotter
